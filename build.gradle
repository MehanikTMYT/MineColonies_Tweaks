plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// fleet 26.1.2 port: NeoGradle userdev 7.1.38 + Java 25, local LDT stack from mavenLocal()/build output,
// JEI integration replaced by EMI (SEMI). Original build script: .fleet-orig/build.gradle.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = rootProject.archives_base_name
}
version = "${rootProject.mc_version}-${rootProject.mod_version}"
group = rootProject.maven_group

repositories {
    mavenLocal()
    maven { name "CurseForge"; url "https://www.cursemaven.com" }
    maven { name "MineColonies"; url "https://ldtteam.jfrog.io/ldtteam/modding" }
    maven { name = "ParchmentMC"; url = "https://maven.parchmentmc.org" }
}

runs {
    configureEach {
        systemProperty "forge.logging.console.level", "info"
        modSource project.sourceSets.main
    }
    client {}
    server { argument '--nogui' }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_api_version}"

    // Required — our 26.1.2 LDT ports (MineColonies is consumed from its build output, like ColonyPathingEdition)
    implementation files("$rootDir/../../MineColonies/build/libs/minecolonies-${minecolonies_version}.jar")
    implementation "com.ldtteam:structurize:${structurize_version}"
    implementation "com.ldtteam:multipiston:${multipiston_version}"
    implementation "com.ldtteam:blockui:${blockui_version}"
    implementation "com.ldtteam:domum-ornamentum:${domumornamentum_version}"

    // Optional
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    compileOnly files("$rootDir/../../pack-libs/curios-neoforge-15.0.0+26.1.2.jar")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mc_version: mc_version,
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license, mod_homepage: mod_homepage, mod_source: mod_source, mod_issues: mod_issues,
        neoforge_api_version: neoforge_api_version, neoforge_api_version_range: neoforge_api_version_range, neoforge_loader_version: neoforge_loader_version,
        minecolonies_version: minecolonies_version
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml", "*.json"]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xmaxerrs", "5000"]
}
